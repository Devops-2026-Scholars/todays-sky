apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast
  labels:
    app.kubernetes.io/name: forecast
    app.kubernetes.io/part-of: weather
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forecast
        app.kubernetes.io/part-of: weather
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forecast
          image: weather-forecast:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forecast
  labels:
    app.kubernetes.io/name: forecast
    app.kubernetes.io/part-of: weather
spec:
  selector:
    app.kubernetes.io/name: forecast
  ports:
    - name: http
      port: 8000
      targetPort: http
