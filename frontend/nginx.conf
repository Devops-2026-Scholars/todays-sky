server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/weather on this page becomes /weather on the Front Desk.
    # The name is looked up on each visit, so a new Front Desk address still works.
    location /api/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        rewrite ^/api/(.*)$ /$1 break;
        set $upstream gateway.weather.svc.cluster.local;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
