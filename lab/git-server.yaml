apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: weather
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
        app.kubernetes.io/part-of: weather
    spec:
      containers:
        - name: git-server
          image: weather-git-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: repos
              mountPath: /repos
      volumes:
        - name: repos
          hostPath:
            path: /var/local/weather-git
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git
  labels:
    app.kubernetes.io/name: git-server
    app.kubernetes.io/part-of: weather
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30090
