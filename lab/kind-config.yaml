# Kind cluster for the weather lab.
# The API door is 6444 so it does not fight with Docker Desktop.
# Doors 30080 and 30090 are opened on the Mac.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: weather
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
